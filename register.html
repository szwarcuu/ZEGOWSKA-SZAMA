<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rejestracja — Zegowska Szama</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="style.css" rel="stylesheet"/>
</head>
<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="index.html">🍕 Zegowska Szama</a>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-8 col-md-5">

        <div class="bg-white rounded-3 p-4 border">
          <h5 class="fw-bold mb-4" style="color: #1a3c5e">Rejestracja</h5>

          <div class="mb-3">
            <label class="form-label fw-semibold" style="font-size:.85rem">Imię i nazwisko</label>
            <input type="text" class="form-control" placeholder="Jan Kowalski"/>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold" style="font-size:.85rem">E-mail</label>
            <input type="email" class="form-control" placeholder="jan.kowalski@szkola.pl"/>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold" style="font-size:.85rem">Hasło</label>
            <input type="password" class="form-control" placeholder="min. 8 znaków"/>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold" style="font-size:.85rem">Powtórz hasło</label>
            <input type="password" class="form-control" placeholder="min. 8 znaków"/>
          </div>

          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="terms"/>
            <label class="form-check-label" style="font-size:.84rem" for="terms">
              Akceptuję regulamin sklepiku
            </label>
          </div>

          <button class="btn w-100 text-white fw-semibold" style="background: #e8a020; border: none; border-radius: 8px;">
            Utwórz konto
          </button>

          <p class="text-center text-muted mt-3 mb-0" style="font-size:.84rem">
            Masz już konto? <a href="login.html" style="color: #1a3c5e">Zaloguj się</a>
          </p>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
